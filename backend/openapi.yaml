openapi: 3.1.0
info:
  title: EntreJergas API
  version: 1.0.0
  description: >
    Contrato entre el frontend Angular y el backend Express. Se edita primero
    este archivo y de él se generan los tipos de ambos proyectos.
servers:
  - url: /
paths:
  /api/health:
    get:
      operationId: health
      summary: Confirma que la API y PostgreSQL responden.
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          {
            description: Servicio disponible.,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/HealthResponse' } } }
          }
  /api/auth/register:
    post:
      operationId: register
      summary: Crea una cuenta y abre una sesión.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } }
      responses:
        default: { $ref: '#/components/responses/Error' }
        '201':
          {
            description: Cuenta creada.,
            content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } }
          }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/auth/login:
    post:
      operationId: login
      summary: Valida las credenciales y abre una sesión.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } }
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          {
            description: Sesión iniciada.,
            content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } }
          }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/auth/me:
    get:
      operationId: currentUser
      summary: Devuelve la cuenta de la sesión actual.
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          {
            description: Sesión activa.,
            content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } }
          }
        '401': { $ref: '#/components/responses/Error' }
  /api/auth/logout:
    post:
      operationId: logout
      summary: Revoca la sesión actual.
      responses:
        default: { $ref: '#/components/responses/Error' }
        '204': { description: Sesión cerrada. }
  /api/lookup:
    post:
      operationId: lookup
      summary: Explica una expresión o las expresiones de una frase.
      description: >
        Si el texto completo ya está en el diccionario no se consulta la IA. Si no, la IA extrae hasta tres
        expresiones y las clasifica. Solo se guardan las regionales con confianza alta y al menos un país.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LookupRequest' } } }
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          {
            description: Resultado de la búsqueda.,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/LookupResponse' } } }
          }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /api/translate:
    post:
      operationId: translate
      summary: Devuelve una definición en inglés.
      description: Con id usa la expresión guardada y conserva la traducción. Sin id traduce la definición temporal enviada.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TranslateRequest' } } }
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          {
            description: Definición traducida.,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/TranslateResponse' } } }
          }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /api/expressions:
    get:
      operationId: searchExpressions
      summary: Recorre el diccionario con búsqueda, filtro por país y paginación.
      parameters:
        - {
            name: q,
            in: query,
            schema: { type: string, maxLength: 100 },
            description: Parte de la expresión. Ignora tildes y mayúsculas.
          }
        - { name: country, in: query, schema: { type: string, pattern: '^[A-Z]{2}$' } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
          }
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          {
            description: Página de resultados.,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/ExpressionPage' } } }
          }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /api/game/round:
    get:
      operationId: gameRound
      summary: Devuelve una ronda de ¿De qué país es? con las palabras del diccionario.
      description: La ronda no incluye la respuesta. Solo participan las expresiones con países conocidos.
      parameters:
        - {
            name: exclude,
            in: query,
            schema: { type: string },
            description: Ids separados por comas que se prefiere no repetir.
          }
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          {
            description: Ronda,
            o null si no hay palabras suficientes.,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/GameRoundResponse' } } }
          }
        '401': { $ref: '#/components/responses/Error' }
  /api/game/answer:
    post:
      operationId: gameAnswer
      summary: Comprueba una respuesta y devuelve la ficha completa.
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/GameAnswerRequest' } } }
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          {
            description: Resultado.,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/GameAnswerResponse' } } }
          }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/history:
    get:
      operationId: history
      summary: Devuelve las últimas 30 búsquedas de la cuenta.
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          {
            description: Historial.,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/HistoryResponse' } } }
          }
        '401': { $ref: '#/components/responses/Error' }
  /api/dashboard:
    get:
      operationId: dashboard
      summary: Devuelve las cifras del diccionario y de la cuenta.
      responses:
        default: { $ref: '#/components/responses/Error' }
        '200':
          {
            description: Cifras.,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/DashboardResponse' } } }
          }
        '401': { $ref: '#/components/responses/Error' }
components:
  responses:
    Error:
      description: La solicitud no se pudo completar.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string, enum: [rate_limited] }
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status: { type: string }
        service: { type: string }
        version: { type: string, description: Commit desplegado, si la plataforma lo informa. }
    User:
      type: object
      required: [id, email, name]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        name: { type: string }
    AuthResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/User' }
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 128 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    LookupRequest:
      type: object
      required: [expression]
      properties:
        expression: { type: string, minLength: 1, maxLength: 300 }
    DefinitionText:
      type: object
      required: [meaning, region, context, equivalent, example]
      properties:
        meaning: { type: string }
        region: { type: string }
        context: { type: string }
        equivalent: { type: string }
        example: { type: string }
    ExpressionEntry:
      allOf:
        - $ref: '#/components/schemas/DefinitionText'
        - type: object
          required: [id, expression, pronunciation, audioUrl, source, countries, register]
          properties:
            id: { type: [integer, 'null'], description: Es null si la definición es temporal. }
            expression: { type: string }
            pronunciation: { type: [string, 'null'] }
            audioUrl: { type: [string, 'null'] }
            source: { type: string, enum: [database, ai] }
            countries:
              type: array
              description: Códigos ISO 3166-1 alfa-2 de los países donde se usa. Vacío si no se conocen.
              items: { type: string, pattern: '^[A-Z]{2}$' }
            register:
              description: Nivel de lenguaje. Es null si no se conoce.
              oneOf:
                - { type: string, enum: [neutral, informal, vulgar] }
                - { type: 'null' }
            classification:
              type: string
              enum: [regional, common]
              description: Solo en definiciones temporales. Una palabra común se explica, pero no se guarda.
    LookupFailureReason:
      type: string
      enum:
        [
          not_found,
          not_configured,
          invalid_response,
          quota_exceeded,
          provider_unavailable,
          rate_limited
        ]
    UnresolvedExpression:
      type: object
      required: [text, reason, suggestion]
      properties:
        text: { type: string }
        reason: { type: string, enum: [typo, unknown] }
        suggestion:
          { type: [string, 'null'], description: Forma correcta si parece un error de escritura. }
    LookupResponse:
      type: object
      required: [found, entries, unresolved]
      properties:
        found: { type: boolean }
        entries:
          type: array
          items: { $ref: '#/components/schemas/ExpressionEntry' }
        unresolved:
          type: array
          items: { $ref: '#/components/schemas/UnresolvedExpression' }
        reason: { $ref: '#/components/schemas/LookupFailureReason' }
        message: { type: string, description: Explicación en español para quien consume la API. }
    TranslateRequest:
      oneOf:
        - type: object
          required: [id]
          properties:
            id: { type: integer, minimum: 1 }
        - allOf:
            - $ref: '#/components/schemas/DefinitionText'
            - type: object
              required: [expression]
              properties:
                expression: { type: string, minLength: 1, maxLength: 100 }
    TranslateResponse:
      type: object
      required: [translation]
      properties:
        translation: { $ref: '#/components/schemas/DefinitionText' }
    ExpressionPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ExpressionEntry' }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    GameRound:
      type: object
      required: [id, expression, options]
      properties:
        id: { type: integer }
        expression: { type: string }
        options:
          type: array
          description: Códigos de país. Exactamente uno es correcto.
          items: { type: string, pattern: '^[A-Z]{2}$' }
    GameRoundResponse:
      type: object
      required: [round]
      properties:
        round:
          oneOf:
            - $ref: '#/components/schemas/GameRound'
            - type: 'null'
    GameAnswerRequest:
      type: object
      required: [id, country]
      properties:
        id: { type: integer, minimum: 1 }
        country: { type: string, pattern: '^[A-Z]{2}$' }
    GameAnswerResponse:
      type: object
      required: [correct, entry]
      properties:
        correct: { type: boolean }
        entry: { $ref: '#/components/schemas/ExpressionEntry' }
    HistorySource:
      type: string
      enum: [database, ai, ai_saved, not_found]
    HistoryItem:
      type: object
      required: [id, expression, found, source, createdAt]
      properties:
        id: { type: integer }
        expression: { type: string }
        found: { type: boolean }
        source: { $ref: '#/components/schemas/HistorySource' }
        createdAt: { type: string, format: date-time }
    HistoryResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/HistoryItem' }
    CountryCount:
      type: object
      required: [country, count]
      properties:
        country: { type: string, pattern: '^[A-Z]{2}$' }
        count: { type: integer }
    DashboardResponse:
      type: object
      required: [expressions, searches, countries]
      properties:
        expressions: { type: integer }
        searches: { type: integer }
        countries:
          type: array
          items: { $ref: '#/components/schemas/CountryCount' }
